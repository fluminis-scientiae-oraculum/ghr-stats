# Read for builds inside this repo only, never by `cargo install fso-ghr-stats`,
# so the x86-64-v2 baseline (SSE4.2, POPCNT) applies to our builds without being
# imposed on installers.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v2"]
