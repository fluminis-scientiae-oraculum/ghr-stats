# ghr-stats configuration. `sudo ghr-stats config` writes this for you; to start
# from this file instead:
#
#   sudo install -Dm600 config.example.toml /etc/ghr-stats/config.toml
#
# The collector reads /etc/ghr-stats/config.toml unless --config FILE or
# $GHR_STATS_CONFIG names another. Every field has a default. The file holds
# GitHub tokens, so keep it mode 0600.

# The collector's SQLite database. Default: /var/lib/ghr-stats/ghr-stats.db for a
# root collector, $XDG_DATA_HOME/ghr-stats/ghr-stats.db otherwise.
# db_path = "/var/lib/ghr-stats/ghr-stats.db"

# Directories holding runner install dirs (each with a `.runner` file).
# Default: empty, meaning the parents of every actions.runner.* unit's
# WorkingDirectory. `ghr-stats config` records the root you choose.
# runner_roots = ["/opt/actions-runner", "/srv/runners"]

# github.com organizations to reconcile INSTEAD of the scopes found in `.runner`
# files. Default: empty, meaning those scopes (organizations, repositories, any host).
# orgs = ["gh-org-a", "gh-org-b"]

# Days of samples to keep; the collector prunes older ones hourly. Job history is
# always kept. "forever" disables pruning.
# retention_days = 30

[intervals]
# Local sampling cadence (runner processes / cgroup / host), seconds.
local_secs = 5
# GitHub API reconcile cadence, seconds (floored at 10).
api_secs = 60
# How old a GitHub reconcile row may be and still be reported as current.
# Unset => three polls' grace with a 180s floor, so raising `api_secs` widens
# this automatically. Past it a runner's GitHub view reads `stale` rather than
# being served as if it were live. Exported as `ghr_api_max_age_seconds`.
# api_max_age_secs = 180

# ── GitHub API (optional, read-only) ───────────────────────────────────────
# Runner online/busy reconcile; `ghr-stats config` validates each token.
#
# What gets reconciled depends on where each runner is registered (its `.runner`):
#   • organization runners  → Organization permissions → "Self-hosted runners" → Read
#   • repository runners    → Repository permissions → "Administration" → Read, on
#                             the repositories that have runners
#   • enterprise runners    → not reconciled (GitHub requires a classic token there)
# Runners are always sampled locally (liveness / CPU / memory / uptime) without a PAT.
#
# Create a FINE-GRAINED personal access token per org or account (a fine-grained PAT
# is scoped to one resource owner):
#   GitHub → Settings → Developer settings → Personal access tokens →
#   Fine-grained tokens → Generate new token
#     • Resource owner: the organization, or the repository's owner for repository runners
#     • Repository access: the repositories whose runners or job results you want
#       read, or none for organization runners without job results
#     • the permission above for your runners                        (required)
#     • Repository permissions → "Actions" → Read-only   (OPTIONAL: lets the
#       collector fill each job's success/failure conclusion; without it jobs
#       still show timing, just a neutral "done")
#     • Expiration: bounded (e.g. 90 days); re-mint on expiry
# The org may require owner approval for the token.
#
# Keys are the org or account login. For GitHub Enterprise Server or GHE.com,
# prefix the host: "ghe.example.com/eng".
#
# [github.tokens]
# "gh-org-a"            = "github_pat_..."
# "ghe.example.com/eng" = "github_pat_..."
#
# Fallback for any github.com org without a specific token above (suits a single-org
# setup); never sent to another host. The GHR_STATS_GITHUB_TOKEN env var overrides it.
# [github]
# token = "github_pat_..."

# ── Metrics (optional) ───────────────────────────────────────────────────────
# The collector service can also expose the fleet metrics. Both off by default.

# Prometheus PULL: a tiny /metrics endpoint scrapers hit.
# [metrics.pull]
# enabled = true
# An ip:port (default 127.0.0.1:9477). The endpoint is unauthenticated: a
# non-loopback address exposes runner and org names to that network.
# addr = "127.0.0.1:9477"

# PUSH: periodically POST the metrics as JSON to an ingest endpoint (e.g.
# OpenObserve's _json API). `auth` is sent as the Authorization header.
# [metrics.push]
# enabled = true
# endpoint = "https://observe.example.com/api/default/ghr_stats/_json"
# auth = "Basic dXNlcjpwYXNz"
# interval_secs = 30
